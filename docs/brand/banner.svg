<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="ServiChile · Universidad Mayor">
  <title>ServiChile  Proyecto semestral Universidad Mayor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8F6"/>
      <stop offset="55%" stop-color="#EEF3F2"/>
      <stop offset="100%" stop-color="#E4EEED"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12636B" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Barra institucional -->
  <rect x="0" y="0" width="1280" height="8" fill="#12636B"/>
  <rect x="0" y="8" width="426" height="4" fill="#A4222B"/>
  <rect x="426" y="8" width="428" height="4" fill="#FEDA3F"/>
  <rect x="854" y="8" width="426" height="4" fill="#3C3C3B"/>

  <!-- Marca -->
  <g transform="translate(88,118)">
    <rect width="148" height="148" rx="28" fill="#12636B"/>
    <path fill="#FEDA3F" d="M74 18c-22 0-40 14.5-40 34.2 0 13.5 8.4 25.2 20.9 31L74 118l18.9-34.8c12.5-5.8 20.9-17.5 20.9-31C113.8 32.5 96 18 74 18z"/>
    <path fill="#12636B" d="M55.5 61.5l9.2 9.2 20.2-20.2 6.6 6.6-26.8 26.8-16-16z"/>
  </g>

  <!-- Tipografía -->
  <text x="280" y="168" font-family="Myriad Pro, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" fill="#12636B" letter-spacing="1.5">ServiChile</text>
  <text x="280" y="214" font-family="Myriad Pro, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#3C3C3B">Due diligence B2B e índice de transparencia de proveedores</text>

  <rect x="280" y="242" width="72" height="4" fill="#A4222B"/>

  <text x="280" y="286" font-family="Myriad Pro, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#12636B" font-weight="600">Universidad Mayor</text>
  <text x="280" y="316" font-family="Myriad Pro, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#3C3C3B">Facultad de Ciencias, Ingeniería y Tecnología · Escuela de Ingeniería Civil</text>
  <text x="280" y="346" font-family="Myriad Pro, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#3C3C3B">INGT1003 · Arquitectura de Desarrollo (Móvil y Web) · 2° semestre 2026 · Prof. Carlos Muñoz S.</text>

  <!-- Pie -->
  <rect x="0" y="404" width="1280" height="16" fill="#12636B"/>
