name: CI

on:
  push:
    branches: [desarrollo, QA, produccion]
  pull_request:
    branches: [desarrollo, QA]

jobs:
  backend:
    name: Backend · pytest + capas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servichile-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servichile-backend/requirements-dev.txt

      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Capas (import-linter)
        run: lint-imports

      - name: Pruebas unitarias
        env:
          APP_ENV: test
        run: pytest -q --ignore=tests/integration
